[project]
name = "spesa-pubblica-ch-pipeline"
version = "0.1.0"
description = "ETL that downloads official Swiss public-spending files and writes the JSON snapshots read by the SwissData Spending site"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]
